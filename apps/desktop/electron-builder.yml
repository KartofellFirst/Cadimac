appId: com.cadimac.desktop
productName: Cadimac
asar: true

directories:
  output: dist/desktop

files:
  - apps/desktop/main.cjs
  - apps/desktop/preload.cjs
  - package.json

extraResources:
  - from: apps/web/.next/standalone
    to: web
  - from: apps/web/.next/static
    to: web/apps/web/.next/static
  - from: apps/web/public
    to: web/apps/web/public

win:
  icon: apps/web/public/assets/cadimac/cadimac-logo.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  icon: apps/web/public/assets/cadimac/cadimac-logo.png
  target:
    - dmg
    - zip
  category: public.app-category.graphics-design
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  syncDesktopName: true
  icon: apps/web/public/assets/cadimac/cadimac-logo.png
  target:
    - AppImage
  category: Graphics
  artifactName: ${productName}-${version}-${arch}.${ext}
